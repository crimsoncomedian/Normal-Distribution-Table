<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normal Distribution Table</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<script>window.MathJax = {tex: {inlineMath: [['\\(', '\\)']]}, svg: {fontCache: 'global'}, options: {enableMenu: false}};</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
<style>
/* Layout: question card beside the bell curve and its z/x table; the worked steps run in one row beneath. */
:root{
  --bg:#E8EEF3; --surface:#FFFFFF; --ink:#13222D; --muted:#566772; --line:#C8D4DC; --head:#EEF3F7;
  --accent:#0B6A8A; --accent-ink:#FFFFFF; --accent-soft:#D5EAF2;
  --hl-soft:#FFF0B3; --hl:#FFD23F; --hl-ink:#13222D;
  --good:#17753F; --good-bg:#DFF2E6; --bad:#B3321F; --bad-bg:#FBE3DE; --info:#0B6A8A; --info-bg:#E3EFF5;
  --display:'Newsreader',Georgia,serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1920; --surface:#15252F; --ink:#E4EDF2; --muted:#93A7B4; --line:#2B404D; --head:#1B2F3B;
    --accent:#5BC0E0; --accent-ink:#07202B; --accent-soft:#1F4151;
    --hl-soft:#4A4118; --hl:#86690F; --hl-ink:#FFF8DC;
    --good:#5CD08A; --good-bg:#173B27; --bad:#FF8C7A; --bad-bg:#432019; --info:#5BC0E0; --info-bg:#1F3A48;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1920; --surface:#15252F; --ink:#E4EDF2; --muted:#93A7B4; --line:#2B404D; --head:#1B2F3B;
  --accent:#5BC0E0; --accent-ink:#07202B; --accent-soft:#1F4151;
  --hl-soft:#4A4118; --hl:#86690F; --hl-ink:#FFF8DC;
  --good:#5CD08A; --good-bg:#173B27; --bad:#FF8C7A; --bad-bg:#432019; --info:#5BC0E0; --info-bg:#1F3A48;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;
  padding-block:20px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1180px; margin:0 auto}
header{display:flex; align-items:baseline; justify-content:space-between; gap:6px 24px; flex-wrap:wrap; margin-bottom:12px}
h1{font-family:var(--display); font-weight:600; font-size:clamp(26px,3.6vw,34px); line-height:1.1; margin:0; text-wrap:balance}
.lede{margin:0; color:var(--muted); font-size:15px}
.bar{display:flex; justify-content:space-between; align-items:center; gap:8px 14px; flex-wrap:wrap; margin-bottom:12px}
.modes{display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; flex-wrap:wrap}
.mode{border:0; background:transparent; color:var(--muted); font-weight:600; font-size:13px; padding:6px 12px; border-radius:7px}
.mode[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.mode[aria-pressed="false"]:hover{color:var(--ink)}
.scoreline{font-size:13px; color:var(--muted); display:flex; gap:10px; align-items:center}
.scoreline b{color:var(--ink); font-variant-numeric:tabular-nums}
.linkish{background:none; border:0; color:var(--muted); text-decoration:underline; padding:2px; font-size:13px}

.layout{display:grid; gap:14px; grid-template-columns:minmax(0,1fr); grid-template-areas:"quiz" "fig" "work"}
@media (min-width:860px){
  .layout{grid-template-columns:minmax(260px,340px) minmax(0,1fr); grid-template-areas:"quiz fig" "work work"}
}
.quiz{grid-area:quiz} .figcard{grid-area:fig} .workcard{grid-area:work}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; min-width:0}
.quiz{padding:14px 16px}
.figcard{padding:12px 14px; display:flex; flex-direction:column; justify-content:center}
.workcard{padding:12px 16px}
h2{font-family:var(--display); font-weight:600; font-size:18px; margin:0 0 6px}
.qmeta{display:flex; justify-content:space-between; gap:12px; align-items:baseline; color:var(--muted); font-size:13px}
.qmeta .label{text-transform:uppercase; letter-spacing:.08em; font-weight:600; font-size:12px}
.tag{font-weight:600; color:var(--accent)}
.story{font-size:17px; margin:6px 0 8px; text-wrap:pretty}
.story b{font-family:var(--mono); font-weight:700; font-size:.92em; white-space:nowrap}
.prompt{margin:0 0 10px; font-weight:600}
.single{display:flex; gap:8px; margin-bottom:8px}
.single input{
  flex:1 1 120px; min-width:0; font:500 20px var(--mono); padding:7px 12px; border-radius:8px;
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
}
.single input:read-only{background:var(--head)}
button{font:inherit; cursor:pointer}
.btnrow{display:flex; gap:8px; flex-wrap:wrap}
.btn{font-weight:600; padding:8px 16px; border-radius:8px; border:1.5px solid var(--accent); background:var(--accent); color:var(--accent-ink)}
.btn:hover{filter:brightness(1.08)}
.ghost{font-weight:500; font-size:14px; padding:6px 12px; border-radius:8px; border:1.5px solid var(--line); background:transparent; color:var(--ink)}
.ghost:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.ghost:disabled{opacity:.45; cursor:default}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.fb{margin-top:10px; padding:8px 12px; border-radius:8px; min-height:3.4em; font-size:15px; background:var(--head); color:var(--muted)}
.fb.good{background:var(--good-bg); color:var(--good)}
.fb.bad{background:var(--bad-bg); color:var(--bad)}
.fb.info{background:var(--info-bg); color:var(--info)}
.num{font-family:var(--mono)}
mjx-container{color:inherit}
mjx-container svg{vertical-align:middle}

/* figure: curve, z row and x row share seven equal columns so ticks line up with the cells */
.figscroll{overflow-x:auto}
.fig{min-width:470px}
.curvewrap{margin-left:34px}
.curve{width:100%; height:auto; display:block}
.curve .axis{stroke:var(--muted); stroke-width:1.5}
.curve .vline{stroke:var(--line); stroke-width:1.5}
.curve .mid{stroke:var(--muted); stroke-width:1.5}
.curve .line{fill:none; stroke:var(--ink); stroke-width:2.2}
.curve .fillc{fill:var(--accent); fill-opacity:.16}
.curve .dot{fill:var(--accent)}
.row{display:grid; grid-template-columns:34px repeat(7,minmax(0,1fr)); align-items:center}
.row .name{font:700 13px var(--mono); color:var(--accent)}
.col{padding:3px; display:flex; justify-content:center; min-width:0}
.zv{font:600 15px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
.cell{
  width:100%; min-width:0; text-align:center; font:500 15px var(--mono); padding:9px 2px; border-radius:6px;
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-variant-numeric:tabular-nums;
}
div.cell{display:block; overflow:hidden}
input.cell.ok{border-color:var(--good); background:var(--good-bg); color:var(--good)}
input.cell.bad{border-color:var(--bad); background:var(--bad-bg); color:var(--bad)}
input.cell.rev{background:var(--accent-soft); border-color:var(--accent)}
input.cell:read-only{cursor:default}
.cell.given{background:var(--head); font-weight:700; border-color:var(--muted)}
.cell.unk{border-style:dashed; color:var(--muted); background:transparent}
.cell.filled{background:var(--accent-soft); border-color:var(--accent); font-weight:700}
.caption{font-size:12.5px; color:var(--muted); margin:6px 0 0}

.workhead{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.work{display:grid; gap:8px; margin:0; padding:0; list-style:none; grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){ .work{grid-template-columns:repeat(var(--n,4),minmax(0,1fr))} }
.work li{display:flex; flex-direction:column; gap:2px; padding:8px 12px; border-radius:8px; background:var(--head); min-height:74px; min-width:0}
.work .k{font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; color:var(--muted)}
.work .k .g{text-transform:none; font-size:15px}
.work .v{font-size:18px; overflow-x:auto; overflow-y:hidden; display:flex; align-items:center; flex:1}
.work li.off .v{color:var(--muted)}
.work li.on{background:var(--hl-soft)}
.work li.on .v{color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto !important; transition:none !important}}
</style>
</head>
<body>

<main class="wrap">
  <header>
    <h1>Normal Distribution Table</h1>
    <p class="lede">Fill in the values at each z-score, and find a missing mean or standard deviation.</p>
  </header>

  <div class="bar">
    <div class="modes" role="group" aria-label="Question types">
      <button class="mode" type="button" data-mode="mixed" aria-pressed="true">Mixed</button>
      <button class="mode" type="button" data-mode="fill" aria-pressed="false">Fill the table</button>
      <button class="mode" type="button" data-mode="find" aria-pressed="false">Find mean or SD</button>
    </div>
    <div class="scoreline"><span id="score">No questions finished yet</span><button class="linkish" id="reset" type="button">Reset</button></div>
  </div>

  <div class="layout">
    <section class="card quiz" aria-labelledby="qlabel">
      <div class="qmeta"><span class="label" id="qlabel">Question <span id="qnum">1</span></span><span class="tag" id="tag"></span></div>
      <p class="story" id="story"></p>
      <p class="prompt" id="prompt"></p>
      <div class="single" id="single" hidden>
        <input id="ans" type="text" inputmode="decimal" placeholder="your answer" aria-label="Your answer">
      </div>
      <div class="btnrow">
        <button class="btn" id="primary" type="button">Check answer</button>
        <button class="ghost" id="hintBtn" type="button">Hint</button>
        <button class="ghost" id="revealBtn" type="button">Show answer</button>
      </div>
      <div class="fb" id="fb" role="status" aria-live="polite"></div>
    </section>

    <section class="card figcard" aria-label="Normal distribution table">
      <div class="figscroll">
        <div class="fig">
          <div class="curvewrap"><svg class="curve" id="curve" viewBox="0 0 700 140" role="img" aria-label="Bell curve with a column for each z-score from negative 3 to 3"></svg></div>
          <div class="row" id="zrow"></div>
          <div class="row" id="xrow"></div>
        </div>
      </div>
      <p class="caption" id="figcap"></p>
    </section>

    <section class="card workcard" aria-label="Worked solution">
      <div class="workhead"><h2>Work</h2><span class="caption" id="workcap">Each hint fills in a step.</span></div>
      <ul class="work" id="work"></ul>
    </section>
  </div>
</main>

<script>
(function(){
  var MINUS = '−';
  var TOL = 0.0051;
  var Z = [-3,-2,-1,0,1,2,3];
  var CTX = [
    {intro:'Scores on a unit test', be:'are', unit:'points', what:'score', mu:[60,90], sd:[4,5,6,8,10,12]},
    {intro:'Heights of adult women', be:'are', unit:'inches', what:'height', mu:[62,66], sd:[2,2.5,3]},
    {intro:'Daily commute times', be:'are', unit:'minutes', what:'commute time', mu:[20,45], sd:[3,4,5,6]},
    {intro:'Fill weights of cereal boxes', be:'are', unit:'ounces', what:'fill weight', mu:[12,18], sd:[0.2,0.3,0.4,0.5]},
    {intro:'Battery life of a phone', be:'is', unit:'hours', what:'battery life', mu:[10,14], sd:[1,1.5,2]},
    {intro:'Resting heart rates', be:'are', unit:'beats per minute', what:'heart rate', mu:[66,76], sd:[4,5,6,8]},
    {intro:'Times to run a mile in gym class', be:'are', unit:'minutes', what:'time', mu:[8,11], sd:[0.5,1,1.5]}
  ];
  function $(id){ return document.getElementById(id); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function r2(x){ return Math.round(x*100)/100; }
  function num(x){ return String(parseFloat(r2(x).toFixed(2))); }
  function par(x){ return x < 0 ? '(' + num(x) + ')' : num(x); }
  function zlab(z){ return (z < 0 ? MINUS : '') + Math.abs(z); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function pdf(z){ return Math.exp(-z*z/2)/Math.sqrt(2*Math.PI); }
  function T(s){ return '\\(' + s + '\\)'; }
  function typeset(el){
    if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(function(){});
  }

  var fb = $('fb'), ans = $('ans'), primary = $('primary'), hintBtn = $('hintBtn'), revealBtn = $('revealBtn');
  var mode = 'mixed', q = null, status = 'open', attempts = 0, hintLevel = 0, shown = 0, steps = [], hintSteps = [1,2];
  var n = 0, first = 0, streak = 0, qnum = 0, seq = 0, bSeq = 0;

  /* ---------- static curve ---------- */
  function drawCurve(){
    var pts = [], z, s = '', i;
    for (i = 0; i <= 140; i++){ z = -3.5 + i * 0.05; pts.push((350 + z*100).toFixed(1) + ',' + (128 - pdf(z)*295).toFixed(1)); }
    s += '<polygon class="fillc" points="0,128 ' + pts.join(' ') + ' 700,128"/>';
    for (i = 0; i < 7; i++){
      z = Z[i];
      s += '<line class="' + (z === 0 ? 'mid' : 'vline') + '" x1="' + (350 + z*100) + '" y1="128" x2="' + (350 + z*100) + '" y2="' + (128 - pdf(z)*295).toFixed(1) + '"/>';
    }
    s += '<polyline class="line" points="' + pts.join(' ') + '"/>';
    s += '<line class="axis" x1="0" y1="128" x2="700" y2="128"/>';
    for (i = 0; i < 7; i++) s += '<circle class="dot" cx="' + (350 + Z[i]*100) + '" cy="128" r="4.5"/>';
    $('curve').innerHTML = s;
  }

  /* ---------- table row ---------- */
  function buildRows(){
    var zr = '<span class="name">z</span>', xr = '<span class="name">x</span>', i;
    for (i = 0; i < 7; i++){
      zr += '<div class="col"><span class="zv">' + zlab(Z[i]) + '</span></div>';
      var inner;
      if (q.type === 'fill'){
        inner = '<input class="cell" id="c' + i + '" data-i="' + i + '" type="text" inputmode="decimal" autocomplete="off" aria-label="Value at z = ' + zlab(Z[i]) + '">';
      } else if (q.given.indexOf(i) >= 0){
        inner = '<div class="cell given" id="c' + i + '">' + num(q.vals[i]) + '</div>';
      } else {
        inner = '<div class="cell unk" id="c' + i + '" aria-label="unknown">?</div>';
      }
      xr += '<div class="col">' + inner + '</div>';
    }
    $('zrow').innerHTML = zr;
    $('xrow').innerHTML = xr;
    if (q.type === 'fill'){
      document.querySelectorAll('input.cell').forEach(function(inp){
        inp.addEventListener('input', function(){ inp.classList.remove('ok','bad'); });
        inp.addEventListener('keydown', function(e){
          if (e.key !== 'Enter') return;
          e.preventDefault();
          if (status === 'done'){ primary.click(); return; }
          var i = +inp.dataset.i;
          if (i < 6) $('c' + (i + 1)).focus(); else check();
        });
      });
    }
  }

  /* ---------- work steps ---------- */
  function G(s){ return '<span class="g">' + s + '</span>'; }
  function buildSteps(){
    var u = '\\ \\text{' + q.c.unit + '}', sd = q.sd, mu = q.mu, s;
    if (q.type === 'fill'){
      var p = r2(2 * sd);
      steps = [
        {k:'Z-score formula', t:'z = \\dfrac{x - \\mu}{\\sigma}'},
        {k:'Substitute (z = 2)', t:'2 = \\dfrac{x - ' + num(mu) + '}{' + num(sd) + '}'},
        {k:'Multiply both sides by ' + G('&sigma;'), t:num(p) + ' = x - ' + num(mu)},
        {k:'Add ' + G('&mu;') + ' to both sides', t:'x = ' + num(p) + ' + ' + num(mu) + ' = ' + num(r2(mu + p)) + u}
      ];
      hintSteps = [1,2];
      $('workcap').textContent = 'Hints work one cell, z = 2, as an example.';
    } else {
      var a = Z[q.given[0]], b = Z[q.given[1]], xa = q.vals[q.given[0]], xb = q.vals[q.given[1]], d = b - a, delta = r2(xb - xa);
      q.a = a; q.b = b; q.xa = xa; q.xb = xb; q.d = d; q.delta = delta;
      if (q.type === 'sd'){
        steps = [
          {k:'Z-steps apart', t:num(b) + ' - ' + par(a) + ' = ' + d},
          {k:'Change in value', t:num(xb) + ' - ' + num(xa) + ' = ' + num(delta)},
          {k:'Divide to find ' + G('&sigma;'), t:'\\sigma = \\dfrac{' + num(delta) + '}{' + d + '} = ' + num(sd) + u}
        ];
        hintSteps = [1,2];
      } else {
        steps = [
          {k:'Find ' + G('&sigma;') + ' from the spacing', t:'\\sigma = \\dfrac{' + num(xb) + ' - ' + num(xa) + '}{' + num(b) + ' - ' + par(a) + '} = ' + num(sd)},
          {k:'Z-score formula', t:'z = \\dfrac{x - \\mu}{\\sigma}'},
          {k:'Substitute a known value', t:num(b) + ' = \\dfrac{' + num(xb) + ' - \\mu}{' + num(sd) + '}'},
          {k:'Solve for ' + G('&mu;'), t:'\\mu = ' + num(xb) + ' - (' + num(b) + ')(' + num(sd) + ') = ' + num(mu) + u}
        ];
        hintSteps = [1,3];
      }
      $('workcap').textContent = 'Each hint fills in steps.';
    }
    var ul = $('work'), h = '', i;
    ul.style.setProperty('--n', steps.length);
    for (i = 0; i < steps.length; i++) h += '<li class="off" id="w' + i + '"><span class="k">' + steps[i].k + '</span><span class="v"></span></li>';
    ul.innerHTML = h;
    shown = 0;
  }
  function showWork(upTo){
    shown = Math.max(shown, upTo);
    steps.forEach(function(st, i){
      var li = $('w' + i), v = li.querySelector('.v'), on = i < shown;
      if (on && li.className === 'on') return;
      li.className = on ? 'on' : 'off';
      v.innerHTML = on ? T(st.t) : '—';
      if (on) typeset(v);
    });
  }

  /* ---------- questions ---------- */
  function showFb(kind, title, html){
    fb.className = 'fb ' + kind;
    fb.innerHTML = '<strong>' + title + '</strong> ' + html;
    typeset(fb);
  }
  function updateScore(){
    $('score').innerHTML = n === 0 ? 'No questions finished yet'
      : 'First try <b>' + first + ' of ' + n + '</b> &middot; Streak <b>' + streak + '</b>';
  }
  function nextType(){
    function findType(){ return (bSeq++ % 2 === 0) ? 'mean' : 'sd'; }
    if (mode === 'fill') return 'fill';
    if (mode === 'find') return findType();
    return (seq++ % 2 === 0) ? 'fill' : findType();
  }
  function choose(pool, k){
    var p = pool.slice(), out = [];
    while (out.length < k){ out.push(p.splice(Math.floor(Math.random() * p.length), 1)[0]); }
    return out.sort(function(x, y){ return x - y; });
  }
  function newQuestion(){
    var type = nextType(), c, mu, sd, key;
    do {
      c = pick(CTX); mu = rnd(c.mu[0], c.mu[1]); sd = pick(c.sd);
      key = c.intro + mu + sd + type;
    } while (q && q.key === key);
    var vals = Z.map(function(z){ return r2(mu + z * sd); });
    q = {type: type, c: c, mu: mu, sd: sd, vals: vals, key: key, clean: true,
         given: type === 'mean' ? choose([0,1,2,4,5,6], 3) : type === 'sd' ? choose([0,1,2,3,4,5,6], 3) : []};
    qnum++;
    status = 'open'; attempts = 0; hintLevel = 0;
    $('qnum').textContent = qnum;
    var cap;
    if (type === 'fill'){
      $('tag').textContent = 'Fill the table';
      $('story').innerHTML = esc(c.intro) + ' ' + c.be + ' normally distributed with a mean of <b>' + num(mu) + ' ' + esc(c.unit) + '</b> and a standard deviation of <b>' + num(sd) + ' ' + esc(c.unit) + '</b>.';
      $('prompt').textContent = 'Fill in the ' + c.what + ' at every z-score.';
      cap = 'Type the value for each z-score. Answers are in ' + c.unit + '.';
    } else {
      $('tag').textContent = type === 'mean' ? 'Find the mean' : 'Find the standard deviation';
      $('story').innerHTML = esc(c.intro) + ' ' + c.be + ' normally distributed. Three values from its table are shown.';
      $('prompt').textContent = type === 'mean' ? 'What is the mean?' : 'What is the standard deviation?';
      cap = 'Values are in ' + c.unit + '. A dashed cell is not shown.';
    }
    $('figcap').textContent = cap;
    $('single').hidden = type === 'fill';
    ans.value = ''; ans.readOnly = false; ans.setAttribute('aria-label', type === 'mean' ? 'Mean in ' + c.unit : 'Standard deviation in ' + c.unit);
    primary.textContent = type === 'fill' ? 'Check table' : 'Check answer';
    hintBtn.disabled = false; revealBtn.disabled = false;
    buildRows();
    buildSteps();
    showWork(0);
    showFb('', 'Your turn.', type === 'fill'
      ? 'z = 0 sits at the mean. Each step in z moves one standard deviation.'
      : 'Neighboring z-scores are 1 apart. Use that to work out the missing value.');
    (type === 'fill' ? $('c0') : ans).focus({preventScroll: true});
  }
  function parse(s){
    s = s.replace(/[\s,]/g, '').replace(/−/g, '-');
    if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
    return parseFloat(s);
  }
  function finish(){
    status = 'done';
    n++;
    if (q.clean){ first++; streak++; } else streak = 0;
    updateScore();
    ans.readOnly = true;
    document.querySelectorAll('input.cell').forEach(function(i){ i.readOnly = true; });
    hintBtn.disabled = true; revealBtn.disabled = true;
    primary.textContent = 'Next question';
    showWork(steps.length);
    primary.focus();
  }
  function fillAll(){
    q.vals.forEach(function(v, i){
      var el = $('c' + i);
      if (q.type === 'fill'){ el.value = num(v); el.classList.remove('bad'); el.classList.add('rev'); }
      else if (q.given.indexOf(i) < 0){ el.className = 'cell filled'; el.textContent = num(v); }
    });
  }
  function checkFill(){
    var vals = [], i, el, v, empty = -1;
    for (i = 0; i < 7; i++){
      el = $('c' + i); v = parse(el.value); vals.push(v);
      if (isNaN(v) && empty < 0) empty = i;
    }
    if (empty >= 0){
      showFb('info', 'Fill every cell.', 'Type a number in each box. Start with z = ' + zlab(Z[empty]) + '.');
      $('c' + empty).focus();
      return;
    }
    attempts++;
    var wrong = [];
    for (i = 0; i < 7; i++){
      el = $('c' + i);
      var okc = Math.abs(vals[i] - q.vals[i]) < TOL;
      el.classList.remove('ok','bad'); el.classList.add(okc ? 'ok' : 'bad');
      if (!okc) wrong.push(i);
    }
    if (!wrong.length){
      fillAll();
      showFb('good', 'All seven are right.', 'Each step to the right adds ' + T('\\sigma') + ' = ' + num(q.sd) + ' ' + esc(q.c.unit) + ', and each step to the left subtracts it.');
      finish();
      return;
    }
    q.clean = false;
    var mirror = wrong.length > 0 && wrong.every(function(i){
      return Z[i] < 0 && Math.abs(vals[i] - r2(q.mu - Z[i] * q.sd)) < TOL;
    });
    var noMean = wrong.length >= 2 && wrong.every(function(i){ return Math.abs(vals[i] - r2(Z[i] * q.sd)) < TOL; });
    var msg;
    if (mirror) msg = 'Left of the mean the values get smaller. For negative z, subtract ' + T('\\sigma') + ' from the mean.';
    else if (noMean) msg = 'Those are z times ' + T('\\sigma') + ' only. Add the mean, ' + num(q.mu) + ', to each.';
    else if (wrong.indexOf(3) >= 0) msg = 'z = 0 is the mean, so the value there is ' + T('\\mu') + '.';
    else msg = 'Red cells need another look. Each step of 1 in z moves one standard deviation from the mean.';
    if (attempts >= 2 && hintLevel < 2) msg += ' Try the hint.';
    showFb('bad', (7 - wrong.length) + ' of 7 are right.', msg);
  }
  function checkSingle(){
    var v = parse(ans.value);
    var isMean = q.type === 'mean', target = isMean ? q.mu : q.sd, unit = esc(q.c.unit);
    if (isNaN(v)){
      showFb('info', 'Enter a number.', 'Type the ' + (isMean ? 'mean' : 'standard deviation') + ', like <span class="num">' + num(target) + '</span>.');
      return;
    }
    attempts++;
    function near(x){ return Math.abs(v - x) < TOL; }
    if (near(target)){
      showFb('good', 'Correct.', isMean
        ? 'The mean is ' + num(q.mu) + ' ' + unit + ', the value at z = 0.'
        : 'The standard deviation is ' + num(q.sd) + ' ' + unit + '. Neighboring z-scores are that far apart.');
      fillAll(); finish();
      return;
    }
    q.clean = false;
    var msg, shownVals = q.given.some(function(i){ return near(q.vals[i]); });
    if (!isMean && q.d !== 1 && near(q.delta)){
      msg = 'That is the change in value from z = ' + num(q.a) + ' to z = ' + num(q.b) + ', which spans ' + q.d + ' z-steps. Divide by ' + q.d + '.';
    } else if (isMean && near(q.sd)){
      msg = 'That is the standard deviation. Use it with the z-score formula and one shown value to find the mean.';
    } else if (shownVals){
      msg = 'That is one of the values shown in the table. ' + (isMean ? 'The mean is the value at z = 0.' : 'Find how far apart two values are per z-step.');
    } else {
      msg = isMean ? 'Find the standard deviation from the spacing first, then work back to z = 0.'
                   : 'The standard deviation is how far apart values are when z differs by 1.';
    }
    if (attempts >= 2 && hintLevel < 2) msg += ' Try the hint.';
    showFb('bad', 'Not yet.', msg);
    ans.select();
  }
  function check(){ if (q.type === 'fill') checkFill(); else checkSingle(); }
  function hint(){
    if (status === 'done') return;
    hintLevel = Math.min(2, hintLevel + 1);
    q.clean = false;
    showWork(hintSteps[hintLevel - 1]);
    var t = q.type;
    if (hintLevel === 1){
      showFb('info', 'Hint 1.', t === 'fill'
        ? 'z = 0 is the mean, and each step of 1 in z moves one standard deviation. Any cell comes from ' + T('z = \\dfrac{x - \\mu}{\\sigma}') + '.'
        : t === 'sd'
          ? 'Neighboring z-scores are 1 apart, so neighboring values are one standard deviation apart. Count the z-steps between two shown values.'
          : 'First find the standard deviation from the spacing between two shown values.');
    } else {
      showFb('info', 'Hint 2.', t === 'fill'
        ? 'Here is z = 2 worked as an example. Values grow to the right of the mean and shrink to the left.'
        : t === 'sd'
          ? 'Find how much the value changes between those two cells, then divide by the number of z-steps.'
          : 'Now use the z-score formula with one shown value and solve for ' + T('\\mu') + '.');
      hintBtn.disabled = true;
    }
  }

  primary.addEventListener('click', function(){
    if (status === 'done'){ newQuestion(); } else check();
  });
  ans.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); primary.click(); } });
  hintBtn.addEventListener('click', hint);
  revealBtn.addEventListener('click', function(){
    if (status === 'done') return;
    q.clean = false;
    fillAll();
    showFb('info', 'Answer.', q.type === 'fill' ? 'All seven values are filled in.'
      : q.type === 'mean' ? 'The mean is ' + num(q.mu) + ' ' + esc(q.c.unit) + '.'
      : 'The standard deviation is ' + num(q.sd) + ' ' + esc(q.c.unit) + '.');
    finish();
  });
  $('reset').addEventListener('click', function(){ n = 0; first = 0; streak = 0; updateScore(); });
  document.querySelectorAll('.mode').forEach(function(b){
    b.addEventListener('click', function(){
      if (b.dataset.mode === mode) return;
      mode = b.dataset.mode; seq = 0; bSeq = 0;
      document.querySelectorAll('.mode').forEach(function(o){ o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      newQuestion();
    });
  });

  drawCurve();
  newQuestion();
  updateScore();
})();
</script>

</body>
</html>
